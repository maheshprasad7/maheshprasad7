name: Generate Snake Animation

on:
  # Automatically run every 24 hours
  schedule:
    - cron: "0 0 * * *" 
  
  # Allows you to manually run the workflow from the Actions tab
  workflow_dispatch:
  
  # Run on every push to the main branch
  push:
    branches:
    - main
    - master

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: generate-snake-game-from-github-contribution-grid
        uses: Platane/snk@v3.5.0
        with:
          # Your github username
          github_user_name: maheshprasad7
          
          # Generates standard and dark mode SVGs with your custom red theme
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ff2d2d&color_dots=#1a1a1a,#5c0000,#990000,#cc0000,#ff2d2d

      # Pushes the generated SVGs to the "output" branch
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
